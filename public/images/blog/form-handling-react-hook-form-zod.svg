<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="5" fill="#e61919"/>
  <path d="M 30 20 L 30 50 M 20 30 L 50 30" stroke="#e61919" stroke-width="2" fill="none"/>
  <path d="M 1170 610 L 1170 580 M 1180 600 L 1150 600" stroke="#333" stroke-width="2" fill="none"/>

  <rect x="40" y="60" width="180" height="24" fill="none" stroke="#e61919" stroke-width="1"/>
  <text x="52" y="77" font-family="'Courier New', monospace" font-size="11" fill="#e61919" font-weight="bold" letter-spacing="3">FORMS / UX</text>

  <text x="40" y="165" font-family="'Courier New', monospace" font-size="44" fill="#f0f0f0" font-weight="bold">FORM</text>
  <text x="40" y="215" font-family="'Courier New', monospace" font-size="44" fill="#e61919" font-weight="bold">HANDLING</text>
  <text x="40" y="258" font-family="'Courier New', monospace" font-size="20" fill="#444">react hook form + zod</text>

  <line x1="40" y1="288" x2="500" y2="288" stroke="#2a2a2a" stroke-width="1"/>
  <text x="40" y="318" font-family="'Courier New', monospace" font-size="13" fill="#444">ALBAR MOERHAMSA · JUNE 2026</text>
  <text x="40" y="418" font-family="'Courier New', monospace" font-size="120" fill="#1a1a1a" font-weight="bold">10</text>

  <!-- RIGHT VISUAL: Form wireframe -->
  <rect x="640" y="70" width="500" height="490" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Form header -->
  <rect x="640" y="70" width="500" height="36" fill="#111"/>
  <text x="655" y="93" font-family="'Courier New', monospace" font-size="12" fill="#555" letter-spacing="2">USER FORM</text>

  <!-- Name field -->
  <text x="655" y="134" font-family="'Courier New', monospace" font-size="10" fill="#444" letter-spacing="1">NAME <tspan fill="#e61919">*</tspan></text>
  <rect x="655" y="140" width="460" height="34" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="668" y="162" font-family="'Courier New', monospace" font-size="12" fill="#333">John Doe</text>

  <!-- Email field -->
  <text x="655" y="200" font-family="'Courier New', monospace" font-size="10" fill="#444" letter-spacing="1">EMAIL <tspan fill="#e61919">*</tspan></text>
  <rect x="655" y="206" width="460" height="34" fill="#111" stroke="#e61919" stroke-width="1"/>
  <text x="668" y="228" font-family="'Courier New', monospace" font-size="12" fill="#333">john@</text>
  <!-- Error state -->
  <text x="655" y="254" font-family="'Courier New', monospace" font-size="10" fill="#e61919">⚠ Please enter a valid email address</text>

  <!-- Role field -->
  <text x="655" y="286" font-family="'Courier New', monospace" font-size="10" fill="#444" letter-spacing="1">ROLE <tspan fill="#e61919">*</tspan></text>
  <rect x="655" y="292" width="460" height="34" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
  <text x="668" y="314" font-family="'Courier New', monospace" font-size="12" fill="#333">Frontend Engineer</text>
  <text x="1070" y="314" font-family="'Courier New', monospace" font-size="14" fill="#444">▾</text>

  <!-- Divider -->
  <line x1="655" y1="350" x2="1115" y2="350" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Zod schema preview -->
  <text x="655" y="378" font-family="'Courier New', monospace" font-size="11" fill="#333">const schema = z.object(&#123;</text>
  <text x="655" y="398" font-family="'Courier New', monospace" font-size="11" fill="#333">  name: z.string().min(1, <tspan fill="#4ec9b0">"required"</tspan>),</text>
  <text x="655" y="418" font-family="'Courier New', monospace" font-size="11" fill="#333">  email: z.string().email(<tspan fill="#4ec9b0">"invalid"</tspan>),</text>
  <text x="655" y="438" font-family="'Courier New', monospace" font-size="11" fill="#333">&#125;);</text>

  <!-- Submit button - disabled state -->
  <rect x="655" y="468" width="220" height="40" fill="#e61919" opacity="0.4"/>
  <text x="765" y="492" font-family="'Courier New', monospace" font-size="12" fill="#888" text-anchor="middle">SAVING...</text>
  <!-- Cancel -->
  <rect x="895" y="468" width="220" height="40" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text x="1005" y="492" font-family="'Courier New', monospace" font-size="12" fill="#444" text-anchor="middle">← CANCEL</text>

  <line x1="40" y1="590" x2="1160" y2="590" stroke="#1a1a1a" stroke-width="1"/>
  <text x="40" y="612" font-family="'Courier New', monospace" font-size="10" fill="#333">albarmoerhamsa.dev/blogs</text>
</svg>
